name = "nerdiest"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./app"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]

# Основная (боевая) игра: отдельный воркер «nardy» со своим ботом и своей базой.
# Тест = воркер nerdiest (ветка main), боевая = воркер nardy (ветка release, команда: npx wrangler deploy --env prod)
[env.prod]
name = "nardy-zona"

[env.prod.assets]
directory = "./app"
binding = "ASSETS"

[[env.prod.durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"
